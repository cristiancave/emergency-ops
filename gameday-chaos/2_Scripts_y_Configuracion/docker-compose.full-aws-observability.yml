version: '3.8'

services:
  aws-rds-postgres:
    image: postgres:16-alpine
    container_name: aws-rds-postgres
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: triage
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 5s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    container_name: aws-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter

  data-service:
    build:
      context: .
      dockerfile: services/data/Dockerfile
    container_name: aws-data-service
    ports:
      - "8083:8083"
    environment:
      - DATA_PORT=8083
      - DATABASE_URL=postgres://triage:devpass@aws-rds-postgres:5432/triage?sslmode=disable
      - ENVIRONMENT=aws-production-sim
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - AWS_REGION=us-east-1
    depends_on:
      aws-rds-postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  triage-service:
    build:
      context: .
      dockerfile: services/triage/Dockerfile
    container_name: aws-triage-service
    ports:
      - "8081:8081"
    environment:
      - TRIAGE_PORT=8081
      - DATABASE_URL=postgres://triage:devpass@aws-rds-postgres:5432/triage?sslmode=disable
      - ENVIRONMENT=aws-production-sim
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - AWS_REGION=us-east-1
    depends_on:
      aws-rds-postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: aws-toxiproxy
    ports:
      - "8474:8474" # Toxiproxy API
      - "8082:8082" # Proxy to triage:8081
    depends_on:
      - triage-service

  dispatch-service:
    build:
      context: .
      dockerfile: services/dispatch/Dockerfile
    container_name: aws-dispatch-service
    ports:
      - "8080:8080"
    environment:
      - DISPATCH_PORT=8080
      - TRIAGE_SERVICE_URL=http://toxiproxy:8082
      - DATA_SERVICE_URL=http://data-service:8083
      - ENVIRONMENT=aws-production-sim
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - AWS_REGION=us-east-1
    depends_on:
      - toxiproxy
      - data-service
